<body data-page="gallery">
<div class="page-shell">
    <div class="announcement-bar"><div class="container">画廊页包含 2 张大图横幅、16 个 gallery-card 和 8 个 review-card，用于图片路径和图文混合结构测试。</div></div>
    <header class="site-header">
        <div class="container header-row">
            <a class="brand-link" href="index.html"><img src="images/logo.png" alt="logo"><span>Benchmark Rich</span></a>
            <nav class="site-nav">
                <ul class="nav-list">
                    <li><a data-nav href="index.html">首页</a></li>
                    <li><a data-nav href="about.html">关于</a></li>
                    <li><a data-nav href="services.html">服务</a></li>
                    <li><a data-nav href="products.html">产品</a></li>
                    <li><a data-nav href="gallery.html">画廊</a></li>
                    <li><a data-nav href="blog.html">博客</a></li>
                    <li><a data-nav href="docs.html">文档</a></li>
                    <li><a data-nav href="pricing.html">套餐</a></li>
                    <li><a data-nav href="faq.html">问答</a></li>
                    <li><a data-nav href="contact.html">联系</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="section-block">
            <div class="container stack-lg">
                <div class="hero-banner-grid">
                    <img src="images/gallery1.jpg" alt="画廊横幅一">
                    <img src="images/gallery2.jpg" alt="画廊横幅二">
                </div>
                <div class="tag-filter" id="gallery-filter-bar">
                    <button class="button button-secondary" data-gallery-filter="all" type="button">全部</button>
                    <button class="button button-secondary" data-gallery-filter="品牌" type="button">品牌</button>
                    <button class="button button-secondary" data-gallery-filter="产品" type="button">产品</button>
                    <button class="button button-secondary" data-gallery-filter="活动" type="button">活动</button>
                </div>
                <div class="card-grid card-grid-4" id="gallery-page-grid"></div>
            </div>
        </section>
        <section class="section-block bg-light">
            <div class="container">
                <h2 class="section-title">画廊评价</h2>
                <div class="card-grid card-grid-4" id="review-grid"></div>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container footer-layout">
            <div class="footer-column"><h3>画廊页</h3><p>适合筛选、切换、预览、重复图片路径和重复说明文本的综合测试场景。</p></div>

        </div>
    </footer>

<script src="js/data.js"></script>
